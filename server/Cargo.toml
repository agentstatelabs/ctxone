[package]
name = "ctxone-hub"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "CtxOne Hub — MCP server for AI agent memory"

[lib]
name = "ctxone_hub"
path = "src/lib.rs"

[[bin]]
name = "ctxone-hub"
path = "src/main.rs"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
reqwest = { workspace = true }

[dependencies]
agentstategraph = { workspace = true }
agentstategraph-core = { workspace = true }
agentstategraph-storage = { workspace = true }
agentstategraph-tasks = { workspace = true }
agentstategraph-migrate = { workspace = true }
rmcp = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tower_governor = { workspace = true }
governor = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
lru = "0.12"
rusqlite = { workspace = true }
rust-embed = { version = "8", features = ["mime-guess"] }
