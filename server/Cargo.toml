[package]
name = "ctxone-hub"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "CTXone Hub, the MCP and HTTP server for AI agent memory, with the Lens web UI built in"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/ctxone-hub"
keywords.workspace = true
categories.workspace = true
# `include` (not the git file list) so the staged Lens build in lens/, which is
# gitignored, is packaged. See build.rs and scripts/stage-lens.sh.
include = ["/src/", "/tests/", "/lens/", "/build.rs", "/Cargo.toml", "/README.md", "/LICENSE"]

[lib]
name = "ctxone_hub"
path = "src/lib.rs"

[[bin]]
name = "ctxone-hub"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
reqwest = { workspace = true }
tokio-stream = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[features]
# Send traces, metrics and logs over OTLP/HTTP once OTEL_EXPORTER_OTLP_ENDPOINT
# is set. Off by default: CTXone sends nothing anywhere unless an operator
# builds this in and points it somewhere.
otlp = ["oxtel/otlp"]

[dependencies]
agentstategraph = { workspace = true }
agentstategraph-core = { workspace = true }
agentstategraph-storage = { workspace = true }
agentstategraph-tasks = { workspace = true }
agentstategraph-taint = { workspace = true }
agentstategraph-reminders = { workspace = true }
agentstategraph-migrate = { workspace = true }
rmcp = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tower_governor = { workspace = true }
governor = { workspace = true }
tracing = { workspace = true }
oxtel = { workspace = true }
oxtel-tower = { workspace = true }
oxtel-rmcp = { workspace = true }
thiserror = { workspace = true }
lru = "0.12"
sha2 = "0.10"
# The version AgentStateGraph's storage uses, for a connection the multi-tenant
# Hub takes out of that pool (tenant_cache::PostgresTenants).
deadpool-postgres = "0.14"
rusqlite = { workspace = true }
rust-embed = { version = "8", features = ["mime-guess"] }
reqwest = { workspace = true }
toml = { workspace = true }
urlencoding = "2"
