[workspace]
resolver = "2"
members = [
    "cli",
    "server",
]

[workspace.package]
version = "1.0.13"
edition = "2024"
authors = ["AgentStateLabs, LLC"]
license = "BUSL-1.1"
repository = "https://github.com/agentstatelabs/ctxone"
homepage = "https://github.com/agentstatelabs/ctxone"
keywords = ["agents", "ai", "memory", "mcp", "context"]
categories = ["command-line-utilities", "development-tools"]
# Local asd state (index logs, caches, sidecar DBs) must never be packaged.
exclude = [".asd/", ".asd-*"]

[workspace.dependencies]
# ASG engine crates, from crates.io. Bump deliberately; the version must already be published.
agentstategraph = "1.3.1"
agentstategraph-core = "1.3.1"
agentstategraph-storage = { version = "1.3.1", features = ["postgres", "memory"] }
agentstategraph-tasks = "1.3.1"
agentstategraph-migrate = "1.3.1"
agentstategraph-taint = "1.3.1"
agentstategraph-reminders = "1.3.1"

# Engine's workspace deps (required because engine crates inherit from workspace)
blake3 = "1"
thiserror = "2"
rusqlite = { version = "0.33", features = ["bundled"] }

# Shared dependencies
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
toml = "0.8"
tiktoken-rs = "0.7"
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rmcp = { version = "1", features = ["server", "transport-io", "transport-streamable-http-server", "macros"] }
schemars = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde", "js"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tower_governor = "0.8"
governor = "0.10"
tracing = "0.1"
# Logs, traces and metrics. OTLP export is the server crate's opt-in `otlp`
# feature, so a default build sends nothing anywhere.
oxtel = { version = "0.2", default-features = false, features = ["log", "config"] }
oxtel-tower = { version = "0.2", features = ["axum"] }
oxtel-rmcp = "0.2"
