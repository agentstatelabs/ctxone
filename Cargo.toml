[workspace]
resolver = "2"
members = [
    "cli",
    "server",
]

[workspace.package]
version = "0.5.0"
edition = "2024"
authors = ["Craig Brown"]
license = "BSL-1.1"
repository = "https://github.com/ctxone/ctxone"

[workspace.dependencies]
# Engine crates (from submodule)
agentstategraph = { path = "engine/crates/agentstategraph" }
agentstategraph-core = { path = "engine/crates/agentstategraph-core" }
agentstategraph-storage = { path = "engine/crates/agentstategraph-storage", features = ["postgres"] }

# Engine's workspace deps (required because engine crates inherit from workspace)
blake3 = "1"
thiserror = "2"
rusqlite = { version = "0.33", features = ["bundled"] }

# Shared dependencies
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "1", features = ["server", "transport-io", "macros"] }
schemars = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde", "js"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
