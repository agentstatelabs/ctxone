[workspace]
resolver = "2"
members = [
    "cli",
    "server",
]

[workspace.package]
version = "0.9.24"
edition = "2024"
authors = ["Craig Brown"]
license = "BSL-1.1"
repository = "https://github.com/agentstatelabs/ctxone"

[workspace.dependencies]
# ASG engine crates — git deps pinned to an ASG release tag (was a GitHub submodule)
agentstategraph = { git = "https://github.com/agentstatelabs/agentstategraph.git", tag = "v0.9.15" }
agentstategraph-core = { git = "https://github.com/agentstatelabs/agentstategraph.git", tag = "v0.9.15" }
agentstategraph-storage = { git = "https://github.com/agentstatelabs/agentstategraph.git", tag = "v0.9.15", features = ["postgres", "memory"] }
agentstategraph-tasks = { git = "https://github.com/agentstatelabs/agentstategraph.git", tag = "v0.9.15" }
agentstategraph-migrate = { git = "https://github.com/agentstatelabs/agentstategraph.git", tag = "v0.9.15" }
agentstategraph-taint = { git = "https://github.com/agentstatelabs/agentstategraph.git", tag = "v0.9.15" }
agentstategraph-reminders = { git = "https://github.com/agentstatelabs/agentstategraph.git", tag = "v0.9.15" }

# Engine's workspace deps (required because engine crates inherit from workspace)
blake3 = "1"
thiserror = "2"
rusqlite = { version = "0.33", features = ["bundled"] }

# Shared dependencies
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
toml = "0.8"
tiktoken-rs = "0.7"
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rmcp = { version = "1", features = ["server", "transport-io", "transport-streamable-http-server", "macros"] }
schemars = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde", "js"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tower_governor = "0.8"
governor = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
