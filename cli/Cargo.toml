[package]
# Published as `ctxone` (`ctx` is taken on crates.io); the binary is still `ctx`.
name = "ctxone"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "The `ctx` CLI for CTXone, memory and context for AI agents"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/ctxone"
keywords.workspace = true
categories.workspace = true
exclude.workspace = true

[[bin]]
name = "ctx"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
clap_complete = { workspace = true }
dirs = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tiktoken-rs = { workspace = true }
tokio = { workspace = true }
# Bounded-concurrency stream combinators for parallel session ingest
# (`buffer_unordered`). Already in the lock graph transitively.
futures = "0.3"
toml = { workspace = true }
chrono = { workspace = true }
# Reading Cursor's chat store (a SQLite db). `bundled` avoids a system
# SQLite dependency, matching the server's use.
rusqlite = { workspace = true }

[dev-dependencies]
tempfile = "3"
