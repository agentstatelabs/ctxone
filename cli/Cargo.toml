[package]
name = "ctx"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "CLI for CtxOne — AI agent memory"

[[bin]]
name = "ctx"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
clap_complete = { workspace = true }
dirs = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tiktoken-rs = { workspace = true }
tokio = { workspace = true }
# Bounded-concurrency stream combinators for parallel session ingest
# (`buffer_unordered`). Already in the lock graph transitively.
futures = "0.3"
toml = { workspace = true }
chrono = { workspace = true }
# Reading Cursor's chat store (a SQLite db). `bundled` avoids a system
# SQLite dependency, matching the server's use.
rusqlite = { workspace = true }
# Shared agent-onboarding engine (suite-onboarding). Git/tag dep like the ASG
# family. For local dev against a working copy, patch it back to a path.
agent-skillgen = { git = "https://git.internal.example/agentstategroup/agent-skillgen.git", tag = "v0.1.0" }

[dev-dependencies]
tempfile = "3"
