# Publishes the CtxOne Hub container to GitHub Container Registry.
#
# Why this exists: the docs have advertised
# `docker run ghcr.io/ctxone/ctxone:latest` since June, but no image was ever
# built or pushed anywhere — not ghcr, not the GitLab registry — so every
# documented Docker install failed. The Dockerfile was fine; nothing ran it.
# Worse, `ctxone` is an unclaimed GitHub org, so that path was squattable.
#
# Trigger matches release.yml: release tags publish, and workflow_dispatch
# allows an on-demand build (useful for the first publish, since the tag for
# the current release already exists).
#
# Auth uses the workflow's built-in GITHUB_TOKEN with packages:write — no PAT,
# so this cannot drift out of sync the way GH_PAT/GITHUB_TOKEN did on
# ctxone-site.
name: docker

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/agentstatelabs/ctxone

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` only on a tag build. A dispatch build is explicitly NOT
      # latest: dispatch can run from any ref, and silently moving `latest`
      # to an arbitrary commit is how a registry starts lying to users.
      - name: Derive tags
        id: meta
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tags=${IMAGE}:${GITHUB_REF_NAME},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:edge-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      # linux/amd64 only. The Dockerfile compiles the Rust workspace from
      # source, and an emulated arm64 build of that takes long enough to be a
      # reliability problem rather than a convenience. Apple Silicon runs this
      # under emulation; brew is the documented Mac path anyway.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Pushed: ${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "NOTE: a newly created ghcr package is PRIVATE by default." >> "$GITHUB_STEP_SUMMARY"
          echo "Anonymous 'docker pull' stays 401 until the package is set" >> "$GITHUB_STEP_SUMMARY"
          echo "to Public once, under the org's Packages settings." >> "$GITHUB_STEP_SUMMARY"
