name: Docker

on:
  workflow_dispatch:
  # Auto-triggers paused 2026-04-24 — GitHub Actions quota at 90%.
  # Restore push/branches and tags triggers ~2026-05-01.
  # push:
  #   branches: [main]
  #   tags: ['v*']

# Multi-arch builds take 10-20 minutes because of QEMU arm64 emulation.
# If several commits land in quick succession, cancel the older in-flight
# runs so we don't burn CI minutes on stale content. Tag pushes keep their
# own group so a new commit on main never cancels a release build.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Checkout submodules with PAT
        # The engine/ submodule points at agentstatelabs/agentstategraph, which
        # is a private repo in a different org from this one. The default
        # GITHUB_TOKEN can't reach it. SUBMODULE_TOKEN is a fine-grained
        # PAT scoped to read access on the ASG repo. Configure git to use
        # it via x-access-token for HTTPS clones, then init submodules.
        # Once ASG moves to the same org as CTXone this step collapses
        # back to actions/checkout@v5 with submodules: recursive.
        run: |
          git config --global url."https://x-access-token:${{ secrets.SUBMODULE_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --recursive

      - name: Set up QEMU
        # Needed to build linux/arm64 on an x86_64 runner.
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build and push (multi-arch)
        # Builds both linux/amd64 and linux/arm64 in a single buildx run.
        # Apple Silicon Macs pull the arm64 variant natively via Docker
        # Desktop; x86_64 Linux hosts pull amd64. One tag, two arches.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
