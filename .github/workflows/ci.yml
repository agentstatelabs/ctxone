name: CI

on:
  workflow_dispatch:
  # Auto-triggers paused 2026-04-24 — GitHub Actions quota at 90%.
  # Restore push/pull_request triggers ~2026-05-01.
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          # Check out CTXone with the default GITHUB_TOKEN, skipping
          # submodules — the engine submodule lives in a different org
          # (agentstatelabs/agentstategraph) and needs a cross-org token.
          submodules: false

      - name: Checkout engine submodule with PAT
        # SUBMODULE_TOKEN is a fine-grained PAT scoped to read access on
        # agentstatelabs/agentstategraph. Same pattern and secret as
        # docker.yml. Once ASG moves to the same org this collapses back
        # to `submodules: recursive` on the checkout above.
        shell: bash
        run: |
          git config --global url."https://x-access-token:${{ secrets.SUBMODULE_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # Only check our own crates — engine is a submodule with its own CI
      - name: Format check
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --package ctx --package ctxone-hub -- --check

      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy -p ctx -p ctxone-hub --no-deps --tests -- -D warnings

      - name: Build
        run: cargo build -p ctx -p ctxone-hub --verbose

      - name: Test
        run: cargo test -p ctx -p ctxone-hub --verbose

  web:
    name: Lens (SvelteKit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

  python:
    name: Python bindings
    runs-on: ubuntu-latest
    needs: rust
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Checkout engine submodule with PAT
        shell: bash
        run: |
          git config --global url."https://x-access-token:${{ secrets.SUBMODULE_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --recursive

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build ctxone-hub (for integration tests)
        run: cargo build -p ctxone-hub --release

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python package
        working-directory: bindings/python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Python tests
        working-directory: bindings/python
        env:
          CTXONE_HUB_BIN: ${{ github.workspace }}/target/release/ctxone-hub
        run: pytest -v
