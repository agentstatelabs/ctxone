name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # Only check our own crates — engine is a submodule with its own CI
      - name: Format check
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --package ctx --package ctxone-hub -- --check

      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy -p ctx -p ctxone-hub --no-deps --tests -- -D warnings

      - name: Build
        run: cargo build -p ctx -p ctxone-hub --verbose

      - name: Test
        run: cargo test -p ctx -p ctxone-hub --verbose

  web:
    name: Lens (SvelteKit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

  python:
    name: Python bindings
    runs-on: ubuntu-latest
    needs: rust
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build ctxone-hub (for integration tests)
        run: cargo build -p ctxone-hub --release

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python package
        working-directory: bindings/python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Python tests
        working-directory: bindings/python
        env:
          CTXONE_HUB_BIN: ${{ github.workspace }}/target/release/ctxone-hub
        run: pytest -v
