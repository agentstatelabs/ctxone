name: Homebrew Tap

# Runs after a tag push that triggers the Release workflow. Downloads the
# release tarballs from the private ctxone/ctxone repo, mirrors them to a
# public release on ctxone/ctxone-docs (so Homebrew can fetch them without
# auth), then renders the formula and pushes it to ctxone/homebrew-tap.
#
# Requirements:
#   - ctxone/ctxone-docs and ctxone/homebrew-tap repos exist.
#   - HOMEBREW_TAP_TOKEN: PAT with repo write access to both public repos.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.75.1)'
        required: true

jobs:
  update-tap:
    name: Render and push formula
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.release.tag_name || github.event.inputs.tag, 'alpha') && !contains(github.event.release.tag_name || github.event.inputs.tag, 'beta') }}
    steps:
      - uses: actions/checkout@v5

      - name: Compute release metadata
        id: meta
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          VERSION="${TAG#v}"
          PUBLIC_BASE_URL="https://github.com/ctxone/ctxone-docs/releases/download/$TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "public_base_url=$PUBLIC_BASE_URL" >> $GITHUB_OUTPUT

      - name: Download tarballs from private release
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          cd dist
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern "ctxone-${TAG}-aarch64-apple-darwin.tar.gz" \
            --pattern "ctxone-${TAG}-x86_64-apple-darwin.tar.gz" \
            --pattern "ctxone-${TAG}-x86_64-unknown-linux-gnu.tar.gz" \
            --pattern "ctxone-${TAG}-aarch64-unknown-linux-gnu.tar.gz"
          sha256sum *.tar.gz

      - name: Mirror tarballs to public ctxone-docs release
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          # Create release on ctxone-docs if it doesn't exist yet
          if ! gh release view "$TAG" --repo ctxone/ctxone-docs &>/dev/null; then
            gh release create "$TAG" \
              --repo ctxone/ctxone-docs \
              --title "CTXone $TAG" \
              --notes "Binary tarballs for Homebrew. Source: ctxone/ctxone@$TAG"
          fi
          gh release upload "$TAG" \
            --repo ctxone/ctxone-docs \
            --clobber \
            dist/ctxone-${TAG}-aarch64-apple-darwin.tar.gz \
            dist/ctxone-${TAG}-x86_64-apple-darwin.tar.gz \
            dist/ctxone-${TAG}-x86_64-unknown-linux-gnu.tar.gz \
            dist/ctxone-${TAG}-aarch64-unknown-linux-gnu.tar.gz

      - name: Render formula
        id: render
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          PUBLIC_BASE_URL: ${{ steps.meta.outputs.public_base_url }}
        run: |
          cd dist
          SHA_DARWIN_ARM64=$(sha256sum "ctxone-${TAG}-aarch64-apple-darwin.tar.gz" | awk '{print $1}')
          SHA_DARWIN_X86_64=$(sha256sum "ctxone-${TAG}-x86_64-apple-darwin.tar.gz" | awk '{print $1}')
          SHA_LINUX_X86_64=$(sha256sum "ctxone-${TAG}-x86_64-unknown-linux-gnu.tar.gz" | awk '{print $1}')
          SHA_LINUX_ARM64=$(sha256sum "ctxone-${TAG}-aarch64-unknown-linux-gnu.tar.gz" | awk '{print $1}')

          cd ..
          cp packaging/homebrew/ctxone.rb.template ctxone.rb
          sed -i "s|{{VERSION}}|${VERSION}|g" ctxone.rb
          sed -i "s|{{URL_DARWIN_ARM64}}|${PUBLIC_BASE_URL}/ctxone-${TAG}-aarch64-apple-darwin.tar.gz|g" ctxone.rb
          sed -i "s|{{SHA_DARWIN_ARM64}}|${SHA_DARWIN_ARM64}|g" ctxone.rb
          sed -i "s|{{URL_DARWIN_X86_64}}|${PUBLIC_BASE_URL}/ctxone-${TAG}-x86_64-apple-darwin.tar.gz|g" ctxone.rb
          sed -i "s|{{SHA_DARWIN_X86_64}}|${SHA_DARWIN_X86_64}|g" ctxone.rb
          sed -i "s|{{URL_LINUX_X86_64}}|${PUBLIC_BASE_URL}/ctxone-${TAG}-x86_64-unknown-linux-gnu.tar.gz|g" ctxone.rb
          sed -i "s|{{SHA_LINUX_X86_64}}|${SHA_LINUX_X86_64}|g" ctxone.rb
          sed -i "s|{{URL_LINUX_ARM64}}|${PUBLIC_BASE_URL}/ctxone-${TAG}-aarch64-unknown-linux-gnu.tar.gz|g" ctxone.rb
          sed -i "s|{{SHA_LINUX_ARM64}}|${SHA_LINUX_ARM64}|g" ctxone.rb

          echo "--- rendered formula ---"
          cat ctxone.rb

      - name: Check out tap repo
        uses: actions/checkout@v5
        with:
          repository: ctxone/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Commit and push formula
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mkdir -p tap/Formula
          cp ctxone.rb tap/Formula/ctxone.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/ctxone.rb
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "ctxone ${VERSION}"
          git push
