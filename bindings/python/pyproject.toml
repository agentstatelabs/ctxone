[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ctxone"
version = "0.9.35"
description = "Python client for CtxOne — persistent, searchable, accountable memory for AI agents"
readme = "README.md"
license = { text = "BUSL-1.1" }
requires-python = ">=3.9"
authors = [{ name = "Craig Brown" }]
keywords = ["ai", "memory", "mcp", "agents", "llm", "context"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.28",
]

[project.urls]
Homepage = "https://github.com/ctxone/ctxone"
Documentation = "https://github.com/ctxone/ctxone/tree/main/docs"
Repository = "https://github.com/ctxone/ctxone"
Issues = "https://github.com/ctxone/ctxone/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "pydantic>=2"]
openwebui = ["pydantic>=2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
