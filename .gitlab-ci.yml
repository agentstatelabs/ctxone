# CI for CTXone (Rust Cargo workspace + SvelteKit "Lens" frontend).
# The Hub (server) embeds web/build/ at compile time via rust-embed, so the
# frontend must be built BEFORE cargo. Vite 8 / Svelte 5 need Node >= 20.19.
# Only run pipelines that matter, and never the same SHA twice:
#  * a merge request gets a detached pipeline, so its branch is checked
#    (frontend, fmt, clippy, build, test) before it merges. The publish jobs
#    run only on main or a tag, so none of them runs in it;
#  * a plain push of any other branch (claude/*, worktree-agent-*, …) gets no
#    pipeline: its merge request's pipeline covers it;
#  * a `release: vX` commit on main is validated by its tag pipeline (release.sh
#    pushes main + tag together — same SHA, plus publish), so its branch
#    pipeline is skipped to avoid a duplicate frontend+compile.
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TITLE =~ /^release: v/'
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: never

stages:
  - frontend
  - check
  - test
  - publish

# --- Frontend: build the SvelteKit static app -> web/build/ (artifact) -------
frontend:
  stage: frontend
  image: node:22-bookworm
  before_script: []
  cache:
    key:
      files:
        - web/package-lock.json
    paths:
      - web/node_modules/
  script:
    - cd web
    - npm ci
    # Before the build, so a failing test stops the pipeline instead of
    # shipping a green artifact. Nothing ran these until now, which is how
    # the suite sat unrunnable (vitest 2 vs vite 8) without anyone noticing.
    - npm run test:unit
    - npm run build
  artifacts:
    paths:
      - web/build/
    expire_in: 1h

# --- Rust jobs (web/build/ artifact flows down from the frontend stage) -------
default:
  image: "$CI_REGISTRY_IMAGE/rust-ci@sha256:33b2bd3b2dfd98934c47d972a8f109918c98bcb43da82d339cb75e0a1057c19e"
  # One writer archives downloads; compiler objects go directly to scoped S3.
  cache: &rust_dependency_cache
    key:
      files: [Cargo.lock]
      prefix: cargo-downloads-v1
    paths: [.cargo/registry/index/, .cargo/registry/cache/, .cargo/git/db/]
    policy: pull
  before_script:
    - export CARGO_HOME="$CI_PROJECT_DIR/.cargo" CARGO_NET_GIT_FETCH_WITH_CLI=true
    - export PYO3_PYTHON="$(command -v python3)"
    - . .ci/configure-sccache.sh
    - start_ci_sccache
    - rustc --version && cargo --version && python3 --version && sccache --version
  after_script:
    - if command -v sccache >/dev/null 2>&1; then sccache --show-stats || true; fi

variables:
  # CI-only: developer/release profiles remain unchanged.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

fmt:
  tags: [macbook-amd64]
  before_script: []
  stage: check
  cache: []
  script:
    - cargo fmt --all -- --check

clippy:
  stage: check
  script:
    - cargo clippy --workspace --all-targets -- -D clippy::correctness

build:
  cache:
    <<: *rust_dependency_cache
    policy: pull-push
  stage: check
  script:
    - cargo build --workspace --locked

test:
  stage: test
  # Postgres for the hub's Postgres tables (server/tests/postgres_hub_tables.rs).
  # Without TEST_DATABASE_URL those tests skip. The alias resolves on both the
  # docker and kubernetes executors.
  services:
    - name: postgres:16
      alias: postgres
  variables:
    POSTGRES_USER: ctx
    POSTGRES_PASSWORD: ctx
    POSTGRES_DB: ctx_test
    TEST_DATABASE_URL: postgres://ctx:ctx@postgres:5432/ctx_test
    # Fail rather than skip if the database is ever missing.
    CTXONE_REQUIRE_POSTGRES: "1"
  script:
    - cargo test --workspace --locked

# version-guard: on a release tag, prove every component version agrees with the
# tag before the mirror publishes it. release.sh keeps Cargo (workspace), the
# python client, and both frontends in lockstep; this enforces it so a mismatch
# fails in the check stage rather than shipping an inconsistent release.
version-guard:
  tags: [macbook-amd64]
  stage: check
  image: alpine:latest
  before_script: []   # alpine has no apt-get; skip the rust default setup
  cache: []
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      TAG="${CI_COMMIT_TAG#v}"
      WS=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
      PY=$(sed -n 's/^version = "\(.*\)"/\1/p' bindings/python/pyproject.toml | head -1)
      WEB=$(sed -n 's/.*"version": "\(.*\)".*/\1/p' web/package.json | head -1)
      SITE=$(sed -n 's/.*"version": "\(.*\)".*/\1/p' website/package.json | head -1)
      echo "tag=$TAG workspace=$WS python=$PY web=$WEB website=$SITE"
      fail=0
      for pair in "workspace:$WS" "python:$PY" "web:$WEB" "website:$SITE"; do
        name=${pair%%:*}; val=${pair#*:}
        [ "$val" = "$TAG" ] || { echo "ERROR: $name version ($val) != tag ($TAG)"; fail=1; }
      done
      if [ "$fail" != 0 ]; then
        echo "Run scripts/release.sh v$TAG on a clean tree, then retag."; exit 1
      fi
      echo "version-guard OK: all components at $TAG"

# publish-github: mirror main + release tags to the PUBLIC GitHub repo, gated on
# scripts/leak-scan.sh (fail closed). Replaces GitLab push mirroring, which
# exposes ALL branches (claude/*, worktree-agent-*); this pushes ONLY main and
# matching release tags. Set CI variables GITHUB_REPO=agentstatelabs/ctxone and
# GITHUB_TOKEN (repo scope, masked + protected). Gated on GITHUB_REPO so it
# no-ops until configured.
publish-github:
  stage: publish
  image: debian:bookworm-slim
  variables:
    GIT_DEPTH: 0   # full history for leak-scan + fast-forward-only push
  cache: {}
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $GITHUB_REPO'
    - if: '$CI_COMMIT_TAG && $GITHUB_REPO'
  script:
    - printf '%s' "${LEAKSCAN_LOCAL:-}" > .leakscan.local
    - bash scripts/publish-to-github.sh

# publish-crates: publish ctxone and ctxone-hub to crates.io from a release tag
# (scripts/publish-crates.sh). It needs publish-github, so only a tag that
# passed the checks, the tests and the mirror's fail-closed leak scan gets
# here, and it runs the leak scan again on the tree it packages. The hub embeds
# Lens, so it takes the frontend job's web/build/ (SKIP_BUILD=1 copies it into
# server/lens/). That artifact expires after an hour; a later retry needs the
# frontend job retried first. Re-running is safe: a crate already at this
# version is skipped. resource_group keeps two tag pipelines from publishing
# at once.
#
# Set CARGO_REGISTRY_TOKEN (masked + protected; v* tags are protected): a
# crates.io token scoped to publish-update and ctxone*. Gated on it so the job
# no-ops until configured.
publish-crates:
  stage: publish
  needs:
    - job: frontend
      artifacts: true
    - job: publish-github
      artifacts: false
  resource_group: crates-io
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/ && $CARGO_REGISTRY_TOKEN'
  script:
    - |
      if [ -z "${LEAKSCAN_LOCAL:-}" ]; then
        echo "ERROR: LEAKSCAN_LOCAL unset; not publishing without the org leak-scan patterns"; exit 1
      fi
      printf '%s' "$LEAKSCAN_LOCAL" > .leakscan.local
    - bash scripts/leak-scan.sh --tree
    - SKIP_BUILD=1 bash scripts/publish-crates.sh --publish

# homebrew: render Formula/ctxone.rb from the published release assets and commit
# it to the tap on GitLab. Runs on tag pipelines only, AFTER publish-github has
# mirrored the tag to GitHub and GitHub Actions has built and published it.
#
# `when: delayed` covers the bulk of that build (~8-11 min) without holding a
# runner; scripts/publish-homebrew.sh then polls, bounded, for the assets.
#
# Direction is GitLab -> GitHub throughout: this job reads public release
# assets over HTTPS and writes to a GitLab project. Nothing reaches back into
# GitLab from GitHub Actions, and the tap URL is built from $CI_SERVER_URL so
# no internal hostname lands in a mirrored file.
#
# Re-running it is safe: the formula only moves forward, so re-running an older
# tag leaves the tap on the newer release, and re-running the current tag
# pushes nothing unless a sha256 needs repairing.
homebrew:
  stage: .post
  image: rust:1-bookworm
  before_script: []   # no cargo needed; the default before_script is rust setup
  # Explicit dependency: if publish-github failed the tag never reached
  # GitHub, so there is nothing to build a formula from — skip rather than
  # poll for 20 minutes and fail.
  needs:
    - job: publish-github
      artifacts: false
  rules:
    - if: $CI_COMMIT_TAG
      when: delayed
      start_in: 10 minutes
  variables:
    RELEASES_REPO: agentstatelabs/ctxone-releases
    TAP_PATH: agentstategroup/homebrew-ctxone
    FORMULA_PATH: Formula/ctxone.rb
    ARTIFACT_PREFIX: ctxone
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git curl ca-certificates python3
    - chmod +x scripts/publish-homebrew.sh
    - ./scripts/publish-homebrew.sh

# site-version: move ctxone in agentstatelabs.com/releases.json to this tag, which
# is what ctxone.com and agentstatelabs.com show as the current version. Runs
# after homebrew so the site never advertises a release users cannot install
# yet. Gated on SITE_RELEASES_TOKEN so it no-ops until that is configured.
site-version:
  stage: .post
  image: debian:bookworm-slim
  before_script: []
  cache: {}
  needs:
    - job: homebrew
      artifacts: false
  rules:
    - if: '$CI_COMMIT_TAG && $SITE_RELEASES_TOKEN'
  variables:
    SITE_PROJECT: site/agentstatelabs-site
    SITE_PRODUCT: ctxone
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates python3
    - ./scripts/publish-site-version.sh
