services:
  hub:
    # Prefer the published image. To build locally instead, comment the
    # image line and uncomment the build block.
    image: ghcr.io/agentstatelabs/ctxone:latest
    # build:
    #   context: .
    #   target: runtime
    command: ["ctxone-hub", "--http", "--port", "3001", "--path", "/data/ctxone.db"]
    ports:
      - "3001:3001"
    volumes:
      - ctxone-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  ctxone-data:
